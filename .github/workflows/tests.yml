name: Tests

on:
  push:
    branches: ["main", "fix/regex-regression-hardening", "fix/regex-engine-regressions"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: npm test
